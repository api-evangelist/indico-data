aid: indico-data
name: Indico Data
description: >-
  Indico Data is an enterprise intelligent document processing (IDP) and
  intelligent process automation (IPA) company that turns unstructured content —
  documents, emails, images, and free text — into structured, usable data. Its
  Agents & Workflows platform lets teams build extraction and classification
  models from as few as ~200 sample documents (no rules or templates) and deploy
  them as document-processing pipelines. Developers integrate via a REST API and
  a companion GraphQL API, authenticating with an API token exchanged for a
  short-lived JWT, and via first-party Python, C#, and Java client libraries. The
  platform is commonly deployed on a dedicated per-customer cluster and is used to
  automate high-volume unstructured-data workflows across insurance, financial
  services, and other document-heavy industries.
